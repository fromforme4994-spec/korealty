<style>
  /* 명함은 사이트 CSS를 쓰지 않는 독립 페이지라 여백만 직접 지운다. */
  html,body{margin:0;padding:0;background:#c6d2e1;}

  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Regular.woff2?v=24ee0095") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2?v=24ee0095") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-SemiBold.woff2?v=24ee0095") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2?v=24ee0095") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Black.woff2?v=24ee0095") format("woff2"); font-weight: 900; font-display: swap; }

  :root{
    color-scheme:light;
    /* 사이트 CI 색을 그대로 쓴다. css/style.css 의 --navy / --red 와 같은 값. */
    --navy:#293E4B;
    --navy-deep:#1B2B35;
    --navy-soft:#3B5566;
    --red:#E23D2C;
    --red-ink:#C0301F;     /* 작은 빨간 글자용. CI 레드는 흰 배경에서 4:1 언저리라 글자로는 부족하다. */
    --text:#22303C;
    --muted:#54626F;       /* 푸른기 도는 패널 위 4.5:1 이상 */
    --faint:#54626F;       /* 밝은 패널 위 작은 라벨용 */
    --faint-deep:#38424D;  /* 짙어진 카드 아래쪽에 놓이는 글자용 */
    --line:rgba(41,62,75,.12);
    --line-soft:rgba(41,62,75,.08);
    /* 흰색이 아니라 푸른기 도는 유리. 레퍼런스처럼 아래로 갈수록 짙어진다. */
    --glass:rgba(240,245,251,.66);
    --glass-strong:rgba(238,243,250,.82);
    --panel:rgba(252,253,255,.62);
    --radius:18px;
    --stack:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    /* 빛이 위에서 오는 부드러운 그림자 */
    --lift:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 40px -24px rgba(27,43,53,.45), 0 4px 12px -8px rgba(27,43,53,.22);
  }
  *{box-sizing:border-box;}

  .stage{
    font-family:var(--stack);
    min-height:100dvh;
    padding:clamp(16px,5vw,44px) 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    background:
      radial-gradient(115% 80% at 50% -12%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 52%),
      radial-gradient(85% 55% at 88% 108%, rgba(41,62,75,.28) 0%, rgba(41,62,75,0) 60%),
      linear-gradient(180deg,#dbe4f0 0%, #b2c2d8 50%, #8fa2bd 100%);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .card{
    width:100%;
    max-width:430px;
    /* 위쪽 광택은 배경 그라데이션으로 넣는다. 덧씌우는 레이어로 만들면
       글자 위를 덮어 워드마크가 씻겨 보인다. */
    background:linear-gradient(180deg, rgba(255,255,255,.92) 0%, var(--glass-strong) 24%, rgba(190,205,226,.92) 66%, rgba(163,181,207,.95) 100%);
    border:1px solid rgba(255,255,255,.75);
    border-radius:28px;
    padding:30px 24px 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 40px 80px -40px rgba(27,43,53,.5),
      0 10px 26px -16px rgba(27,43,53,.28);
    position:relative;
    overflow:hidden;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  /* 유리 질감은 지원하는 기기에서만. 안 되면 위의 불투명 흰색으로 남는다. */
  @supports ((backdrop-filter:blur(24px)) or (-webkit-backdrop-filter:blur(24px))){
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,.84) 0%, var(--glass) 24%, rgba(186,201,223,.8) 66%, rgba(158,177,204,.86) 100%);
      -webkit-backdrop-filter:blur(24px) saturate(150%); backdrop-filter:blur(24px) saturate(150%);
    }
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .card{animation:none} }

  /* ---- wordmark ---- */
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:26px;
  }
  .wordmark{ display:flex; align-items:center; }
  .wordmark img{ height:22px; width:auto; display:block; }

  /* ---- identity ---- */
  .eyebrow{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--red-ink); font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; gap:9px;
  }
  .eyebrow::after{content:""; height:1px; flex:1; background:linear-gradient(90deg, rgba(226,61,44,.35), rgba(226,61,44,0));}

  .name{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
    margin:0 0 6px;
  }
  .name h1{
    margin:0; font-weight:800; font-size:40px; letter-spacing:-.02em;
    line-height:1; color:var(--navy-deep);
  }
  .name .role{
    font-size:15px; font-weight:700; color:var(--navy);
    padding:4px 12px; border:1px solid rgba(41,62,75,.18);
    border-radius:999px; background:rgba(255,255,255,.75); letter-spacing:.01em;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 4px 10px -8px rgba(27,43,53,.5);
  }
  .romaji{ font-size:11.5px; letter-spacing:.22em; color:var(--muted); font-weight:600; margin:0 0 16px; text-transform:uppercase;}
  /* 사업 영역은 여기 한 번만 적는다. 머리말·꼬리말에 또 쓰면 같은 말이 세 번 나온다. */
  .org{ margin:0 0 22px; font-size:12.5px; color:var(--muted); letter-spacing:.04em; font-weight:500;}

  /* ---- primary CTA ---- */
  .save{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; padding:16px; margin-bottom:20px;
    background:linear-gradient(180deg,var(--navy-soft) 0%, var(--navy) 100%);
    color:#fff; border:none; cursor:pointer;
    border-radius:999px; font-family:var(--stack); font-weight:800; font-size:15.5px;
    letter-spacing:.01em;
    box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 14px 28px -16px rgba(27,43,53,.85), 0 4px 10px -8px rgba(27,43,53,.5);
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .save:hover{filter:brightness(1.06);}
  .save:active{transform:translateY(1px) scale(.995);}
  .save svg{width:19px;height:19px;}

  /* ---- contact rows ---- */
  .rows{
    display:flex; flex-direction:column; margin-bottom:18px;
    border:1px solid rgba(255,255,255,.85); border-radius:var(--radius); overflow:hidden;
    background:var(--panel);
    box-shadow:var(--lift);
  }
  .row{
    display:grid; grid-template-columns:42px 1fr auto; align-items:center;
    gap:13px; padding:13px 15px; color:var(--text); text-decoration:none;
    transition:background .16s ease;
  }
  .row + .row{border-top:1px solid var(--line-soft);}
  .row:hover{background:rgba(255,255,255,.8);}
  .row:active{background:rgba(41,62,75,.06);}
  .ic{
    /* 레퍼런스의 원형 버튼 감각은 여기로 옮겼다. 따로 둔 원형 바로가기는
       아래 목록과 하는 일이 같아 뺐다. */
    width:42px;height:42px;border-radius:50%; display:grid;place-items:center;
    background:linear-gradient(180deg,#ffffff,#e6ecf5);
    border:1px solid rgba(255,255,255,.85); color:var(--navy);
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 6px 14px -10px rgba(27,43,53,.6);
  }
  .ic svg{width:18px;height:18px;}
  .row .meta{min-width:0;}
  .row .lab{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:2px;}
  .row .val{font-size:15px; font-weight:600; color:var(--navy-deep); font-variant-numeric:tabular-nums; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* 이메일·홈페이지는 대문자로 보이게만 한다. mailto:/href 값은 소문자 그대로다. */
  .row .val.mail{text-transform:uppercase; letter-spacing:.01em;}
  .chev{color:var(--faint); display:flex;}
  .chev svg{width:16px;height:16px;}

  /* ---- address ---- */
  .addr{
    display:block; text-decoration:none; color:var(--text);
    border:1px solid rgba(255,255,255,.85); border-radius:var(--radius);
    padding:15px 16px; margin-bottom:20px; background:var(--panel);
    box-shadow:var(--lift);
    transition:background .16s ease;
  }
  .addr:hover{background:rgba(255,255,255,.8);}
  .addr .lab{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:7px;}
  .addr .lab svg{width:14px;height:14px;color:var(--red);}
  .addr .a1{font-size:14.5px; font-weight:600; line-height:1.5; color:var(--navy-deep);}
  .addr .a2{font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:2px;}
  .addr .go{margin-top:9px; font-size:12px; font-weight:700; color:var(--navy); display:inline-flex; align-items:center; gap:5px; letter-spacing:.02em;}
  .addr .go svg{width:13px;height:13px;}

  /* ---- footer ---- */
  .foot{
    text-align:center; padding-top:16px; border-top:1px solid var(--line);
  }
  /* 카드 아래쪽이 짙어 여기만 더 진한 글자색을 쓴다. 밝은 패널 위 라벨까지
     이 색으로 내리면 필요 이상으로 무거워진다. */
  .foot .hint{font-size:11px; color:var(--faint-deep); letter-spacing:.01em;}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep); color:#fff; font-weight:700; font-size:13.5px;
    padding:12px 20px; border-radius:999px; box-shadow:0 20px 40px -18px rgba(27,43,53,.7);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:50; font-family:var(--stack); display:flex; align-items:center; gap:8px;
  }
  .toast svg{width:16px;height:16px;color:#5fd39a;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:380px){
    .name h1{font-size:34px;}
    .card{padding:26px 18px 20px;}
  }
</style>
</head>

<script>
(function(){
  var vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:최준성;;;;",
    "FN:최준성",
    "ORG:코리얼티디엠씨(KOREALTY)",
    "TITLE:대표",
    "TEL;TYPE=CELL:010-9028-4994",
    "TEL;TYPE=WORK,VOICE:1599-5022",
    "EMAIL;TYPE=INTERNET:kangsuk4@naver.com",
    "URL:https://korealty.co.kr",
    "ADR;TYPE=WORK:;;서울시 마포구 백범로 8 2층 210호 (노고산동 107-17 우정마샹스);;;;대한민국",
    "END:VCARD"
  ].join("\r\n");

  var btn = document.getElementById("saveBtn");
  var toast = document.getElementById("toast");
  var toastTimer;

  btn.addEventListener("click", function(){
    try{
      var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "최준성_코리얼티디엠씨.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast();
    }catch(e){
      // Fallback: open as data URI
      window.location.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
    }
  });

  function showToast(){
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2600);
  }
})();
</script>
