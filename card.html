<link rel="apple-touch-icon" href="assets/img/favicon-180.png?v=a17d6f32">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/Pretendard-Bold.woff2?v=e70452c0" crossorigin>

<style>
  /* 명함은 사이트 CSS를 쓰지 않는 독립 페이지라 여백만 직접 지운다. */
  html,body{margin:0;padding:0;background:#7c8899;}

  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Regular.woff2?v=e70452c0") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Medium.woff2?v=e70452c0") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-SemiBold.woff2?v=e70452c0") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Bold.woff2?v=e70452c0") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Pretendard"; src: url("assets/fonts/Pretendard-Black.woff2?v=e70452c0") format("woff2"); font-weight: 900; font-display: swap; }

  :root{
    color-scheme:light;
    /* 사이트 CI 색. css/style.css 의 --navy / --red 와 같은 값. */
    --navy:#293E4B;
    --navy-deep:#1B2B35;
    --navy-soft:#3B5566;
    --red:#E23D2C;
    --red-ink:#C0301F;     /* 작은 빨간 글자용. CI 레드는 흰 배경에서 4:1 언저리라 글자로는 부족하다. */
    /* 글자는 전부 흰 카드 위에만 놓인다. 그래서 색을 어둡게 끌어내릴 필요가 없다. */
    --text:#1F2A35;
    --muted:#5C6875;
    --faint:#66727F;
    --rule:rgba(31,42,53,.12);      /* 구획을 나누는 선 */
    --rule-soft:rgba(31,42,53,.07); /* 항목 사이 선 */
    --stack:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}

  /* 짙은 것은 카드가 아니라 배경이다. 카드를 어둡게 하면 글자 대비가 계속
     빠듯해지지만, 배경만 내리면 깊이는 그대로면서 글자는 흰 바탕에 남는다. */
  .stage{
    font-family:var(--stack);
    min-height:100dvh;
    padding:clamp(20px,6vw,56px) 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    background:
      radial-gradient(circle at 14% 16%, rgba(126,140,163,.75) 0 9%, rgba(126,140,163,0) 42%),
      radial-gradient(circle at 88% 10%, rgba(17,25,35,.55) 0 8%, rgba(17,25,35,0) 38%),
      radial-gradient(circle at 10% 78%, rgba(31,43,58,.55) 0 11%, rgba(31,43,58,0) 44%),
      radial-gradient(circle at 94% 84%, rgba(45,60,80,.5) 0 10%, rgba(45,60,80,0) 40%),
      radial-gradient(circle at 62% 52%, rgba(255,255,255,.3) 0 6%, rgba(255,255,255,0) 30%),
      linear-gradient(160deg,#b4bdc9 0%, #8b96a6 48%, #6a7686 100%);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .card{
    width:100%;
    max-width:410px;
    background:#fff;
    border-radius:30px;
    padding:28px 26px 24px;
    box-shadow:
      0 50px 90px -40px rgba(12,20,30,.55),
      0 14px 32px -18px rgba(12,20,30,.35);
    animation:rise .6s cubic-bezier(.2,.7,.2,1) .78s both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---- 인트로: 로고가 먼저, 그다음 명함 ----
     명함은 빨리 보고 싶은 화면이라 1.2초 안에 끝낸다. 더 끌면 방해가 된다. */
  .splash{
    position:fixed; inset:0; z-index:40;
    display:grid; place-items:center;
    /* tools/build-og-card.py 의 미리보기 배경과 같은 값. 두 화면은 브랜드가
       처음 보이는 자리라 색이 어긋나면 티가 난다. 한쪽을 바꾸면 다른 쪽도 바꾼다. */
    background:
      radial-gradient(circle at 82% 20%, rgba(226,61,44,.20) 0 12%, rgba(226,61,44,0) 46%),
      radial-gradient(circle at 16% 86%, rgba(90,116,150,.35) 0 14%, rgba(90,116,150,0) 50%),
      linear-gradient(150deg,#263746 0%, #17242f 55%, #0d151d 100%);
    animation:splash-out .45s ease .82s both;
  }
  .splash img{
    width:min(58vw,240px); height:auto; display:block;
    animation:logo-in .5s cubic-bezier(.2,.7,.2,1) .06s both,
              logo-out .4s ease .8s both;
  }
  @keyframes logo-in{ from{opacity:0; transform:scale(.9)} to{opacity:1; transform:scale(1)} }
  @keyframes logo-out{ to{opacity:0; transform:scale(1.08)} }
  @keyframes splash-out{ to{opacity:0; visibility:hidden} }

  /* 움직임을 줄이도록 설정한 사람에게는 인트로를 보이지 않는다. */
  @media (prefers-reduced-motion:reduce){
    .card{animation:none}
    .splash{display:none}
  }

  /* ---- 머리말 ---- */
  .wordmark{ display:flex; }
  .wordmark img{ height:21px; width:auto; display:block; }

  /* 구획선. 레퍼런스처럼 상자로 묶지 않고 선으로만 나눈다. */
  .rule{ height:1px; background:var(--rule); margin:22px 0; }

  /* ---- 이름 ---- */
  .eyebrow{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--red-ink); font-weight:700; margin-bottom:10px;
  }
  .name{ display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin:0 0 7px; }
  .name h1{ margin:0; font-weight:800; font-size:38px; letter-spacing:-.02em; line-height:1.05; color:var(--navy-deep); }
  .name .role{
    font-size:14px; font-weight:700; color:var(--navy);
    padding:4px 12px; border:1px solid rgba(41,62,75,.2);
    border-radius:999px; letter-spacing:.01em;
  }
  .romaji{ font-size:11px; letter-spacing:.22em; color:var(--faint); font-weight:600; margin:0 0 12px; text-transform:uppercase; }
  /* 사업 영역은 여기 한 번만 적는다. 머리말·꼬리말에 또 쓰면 같은 말이 세 번 나온다. */
  .org{ margin:0; font-size:12.5px; color:var(--muted); letter-spacing:.03em; font-weight:500; }

  /* ---- 구획 제목 ---- */
  .sec{
    font-size:12px; font-weight:700; color:var(--navy-deep);
    letter-spacing:.06em; margin:0 0 4px;
  }

  /* ---- 연락처: 왼쪽 라벨 / 오른쪽 값 ---- */
  .list{ margin-top:6px; }
  .row{
    display:grid; grid-template-columns:auto 1fr auto; align-items:baseline;
    gap:12px; padding:13px 0; text-decoration:none; color:var(--text);
    border-top:1px solid var(--rule-soft);
    transition:opacity .15s ease;
  }
  .row:first-child{ border-top:0; }
  .row:active{ opacity:.55; }
  .row .lab{ font-size:12.5px; color:var(--muted); font-weight:500; white-space:nowrap; }
  .row .val{
    /* 값은 굵게 두지 않는다. 라벨과의 구분은 크기와 색으로 충분하다. */
    font-size:15.5px; font-weight:500; color:var(--navy-deep); text-align:right;
    font-variant-numeric:tabular-nums; letter-spacing:.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* 이메일·홈페이지는 대문자로 보이게만 한다. mailto:/href 값은 소문자 그대로다. */
  .row .val.mail{ text-transform:uppercase; letter-spacing:.02em; font-size:14.5px; }
  /* 화살표는 그림 요소라 3:1 이 기준이다. 더 흐리면 눌리는 줄로 안 보인다. */
  .row .chev{ color:#838F9C; display:flex; align-self:center; }
  .row .chev svg{ width:15px; height:15px; }
  @media (hover:hover){ .row:hover .val{ color:var(--red-ink); } .row:hover .chev{ color:var(--red-ink); } }

  /* ---- 오시는 길 ---- */
  .addr{ padding-top:4px; }
  .addr .a1{ font-size:14.5px; font-weight:600; line-height:1.55; color:var(--navy-deep); }
  .addr .a2{ font-size:12.5px; color:var(--muted); line-height:1.55; margin-top:2px; }
  /* 티맵은 넣지 않는다. 웹 주소가 없어 앱이 없으면 눌러도 아무 일이 없고,
     iOS 와 안드로이드의 파라미터 이름도 다르다. 네이버·카카오는 둘 다
     웹 주소가 있어 앱 없이도 열린다. */
  .maps{ display:flex; gap:8px; margin-top:11px; }
  .maps a{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 8px; border:1px solid rgba(41,62,75,.22); border-radius:999px;
    font-size:12.5px; font-weight:700; color:var(--navy); text-decoration:none;
    letter-spacing:.01em; transition:border-color .16s ease, color .16s ease;
  }
  .maps a svg{ width:12px; height:12px; }
  .maps a:active{ opacity:.6; }
  @media (hover:hover){ .maps a:hover{ color:var(--red-ink); border-color:rgba(192,48,31,.45); } }

  /* ---- 저장 버튼 ---- */
  .save{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; padding:17px; margin-top:4px;
    background:var(--navy-deep); color:#fff; border:none; cursor:pointer;
    border-radius:999px; font-family:var(--stack); font-weight:800; font-size:15.5px;
    letter-spacing:.01em;
    box-shadow:0 14px 26px -16px rgba(12,20,30,.9);
    transition:transform .15s ease, background .2s ease;
  }
  .save:hover{ background:#25384a; }
  .save:active{ transform:translateY(1px) scale(.995); }
  .save svg{ width:19px; height:19px; }

  .hint{ text-align:center; font-size:11px; color:var(--faint); margin-top:11px; letter-spacing:.01em; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:var(--navy-deep); color:#fff; font-weight:700; font-size:13.5px;
    padding:12px 20px; border-radius:999px; box-shadow:0 20px 40px -18px rgba(12,20,30,.8);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:50; font-family:var(--stack); display:flex; align-items:center; gap:8px;
  }
  .toast svg{ width:16px; height:16px; color:#5fd39a; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:380px){
    .name h1{ font-size:33px; }
    .card{ padding:24px 20px 20px; }
    .rule{ margin:18px 0; }
  }
</style>
</head>
<body>

<div class="splash" aria-hidden="true">

<div class="stage">

<script>
(function(){
  var vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:최준성;;;;",
    "FN:최준성",
    "ORG:코리얼티디엠씨(KOREALTY)",
    "TITLE:대표",
    "TEL;TYPE=CELL:010-9028-4994",
    "TEL;TYPE=WORK,VOICE:1599-5022",
    "EMAIL;TYPE=INTERNET:kangsuk4@naver.com",
    "URL:https://korealty.co.kr",
    "ADR;TYPE=WORK:;;서울시 마포구 백범로 8 2층 210호 (노고산동 107-17 우정마샹스);;;;대한민국",
    "END:VCARD"
  ].join("\r\n");

  // 인트로는 CSS 애니메이션이 끝내지만, 애니메이션이 동작하지 않는 환경에서
  // 덮개가 그대로 남아 명함을 가리는 일이 없도록 시간이 지나면 걷어낸다.
  var splash = document.querySelector(".splash");
  if (splash) setTimeout(function(){ splash.remove(); }, 1600);

  var btn = document.getElementById("saveBtn");
  var toast = document.getElementById("toast");
  var toastTimer;

  btn.addEventListener("click", function(){
    try{
      var blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "최준성_코리얼티디엠씨.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast();
    }catch(e){
      // Fallback: open as data URI
      window.location.href = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
    }
  });

  function showToast(){
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2600);
  }
})();
</script>
